<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中大哲学 · 历年真题检索</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #173b73;
      --ink-dark: #102a52;
      --paper: #f4f7fb;
      --white: #fff;
      --line: #d8e2ef;
      --muted: #627188;
      --accent: #c64132;
      --pale: #eaf0f8;
      --shadow: 0 18px 55px rgba(16, 42, 82, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink-dark);
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    main {
      width: min(1280px, calc(100% - 56px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) 175px auto;
      gap: 10px;
      margin-bottom: 10px;
    }
    .filter-strip {
      display: grid;
      grid-template-columns: auto minmax(145px, .8fr) 170px 150px auto;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 18px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      background: #eaf0f8;
    }
    .filter-strip-title {
      display: grid;
      place-items: center;
      padding: 0 7px;
      color: var(--ink);
      font: 700 12px/1 SimSun, "STSong", serif;
      letter-spacing: .08em;
    }
    .filter-control {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 4px;
      min-width: 0;
    }
    .filter-control span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }
    .filter-control select { min-height: 34px; width: 100%; }
    .reset-structured {
      align-self: end;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid #b8c7d9;
      background: transparent;
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
    }
    .reset-structured:hover { background: white; }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--white);
      border: 1px solid var(--line);
      transition: border-color .16s, box-shadow .16s;
    }
    .search-box:focus-within {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(23, 59, 115, .1);
    }
    .search-box label { padding: 0 12px; color: var(--ink); font-size: 12px; font-weight: 700; }
    input, select, button { font: inherit; }
    input {
      width: 100%;
      border: 0;
      outline: 0;
      padding: 12px 10px 12px 0;
      color: var(--ink-dark);
      background: transparent;
    }
    select {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink-dark);
      padding: 0 11px;
      outline: 0;
    }
    select:focus-visible, button:focus-visible {
      outline: 3px solid rgba(23, 59, 115, .2);
      outline-offset: 1px;
    }
    button {
      border: 0;
      padding: 0 19px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    #search:hover:not(:disabled) {
      background: #e8ebef;
      color: #181b20;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(480px, 1.35fr) minmax(340px, .85fr);
      min-height: 545px;
      background: var(--white);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    .search-layout {
      display: grid;
      grid-template-columns: 282px minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
    }
    .tag-panel {
      height: 547px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--white);
      border: 1px solid var(--line);
      box-shadow: 0 12px 38px rgba(16, 42, 82, .08);
    }
    .tag-panel-head {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px 0 16px;
      background: var(--ink);
      color: white;
    }
    .tag-panel-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font: 700 15px/1 SimSun, "STSong", serif;
    }
    .tag-panel-title span {
      color: #cbd8e9;
      font: 400 11px/1.2 "Microsoft YaHei UI", sans-serif;
    }
    .clear-tags {
      min-height: 30px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, .28);
      background: transparent;
      color: white;
      font-size: 11px;
      font-weight: 600;
    }
    .clear-tags:hover:not(:disabled) { background: rgba(255, 255, 255, .1); }
    .clear-tags:disabled,
    .clear-tags:disabled:hover,
    .clear-tags:disabled:active {
      background: transparent;
      opacity: .38;
      cursor: default;
    }
    .tag-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .tag-tab {
      min-height: 42px;
      padding: 6px 4px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .tag-tab:nth-child(3n) { border-right: 0; }
    .tag-tab:hover { background: var(--pale); color: var(--ink); }
    .tag-tab.active {
      background: var(--white);
      color: var(--ink);
      box-shadow: inset 0 -3px var(--accent);
    }
    .tag-tab strong {
      display: inline-block;
      min-width: 17px;
      margin-left: 3px;
      color: var(--accent);
      font-size: 10px;
    }
    .tag-tools {
      padding: 12px 12px 9px;
      border-bottom: 1px solid var(--line);
    }
    .tag-search {
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      background: #fbfcfe;
    }
    .tag-search label {
      padding-left: 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .tag-search input { padding: 8px 8px; font-size: 12px; }
    .tag-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 0 10px;
    }
    .tag-option {
      width: 100%;
      min-height: 36px;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      background: white;
      color: var(--ink-dark);
      text-align: left;
      font-size: 12px;
      font-weight: 400;
    }
    .tag-option:hover { background: #f5f8fc; }
    .tag-option.selected {
      background: #e8eef7;
      box-shadow: inset 4px 0 var(--accent);
      color: var(--ink);
      font-weight: 700;
    }
    .tag-mark {
      width: 14px;
      height: 14px;
      display: grid;
      place-items: center;
      border: 1px solid #aab9cc;
      color: white;
      font-size: 10px;
      line-height: 1;
    }
    .tag-option.selected .tag-mark {
      border-color: var(--accent);
      background: var(--accent);
    }
    .tag-count {
      min-width: 24px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .tag-empty {
      padding: 24px 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .results-panel { min-width: 0; border-right: 1px solid var(--line); }
    .panel-head {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: var(--pale);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }
    .panel-head span { color: var(--muted); font-weight: 400; }
    .results { height: 499px; overflow: auto; }
    .result {
      width: 100%;
      border-bottom: 1px solid #edf1f6;
      background: white;
      color: var(--ink-dark);
    }
    .result.active {
      background: #e2ebf7;
      box-shadow: inset 4px 0 var(--ink);
    }
    .result-summary {
      width: 100%;
      display: grid;
      grid-template-columns: 58px 94px 86px 1fr;
      gap: 10px;
      align-items: start;
      padding: 14px 16px 8px;
      background: transparent;
      color: var(--ink-dark);
      text-align: left;
      font-weight: 400;
    }
    .result-summary:hover { background: #f7f9fc; }
    .result.active .result-summary:hover { background: transparent; }
    .result-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 0 16px 12px 284px;
    }
    .meta { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .question { font-size: 14px; line-height: 1.6; }
    .result-copy { min-width: 0; }
    .match-fields {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-top: 7px;
    }
    .match-fields-label {
      margin-right: 1px;
      color: var(--muted);
      font-size: 10px;
    }
    .match-field {
      padding: 2px 6px;
      border: 1px solid #ccd7e5;
      background: #f6f8fb;
      color: #53657b;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.3;
    }
    .result-snippet {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }
    mark.match {
      padding: 0 .08em;
      background: #ffed9f;
      box-shadow: inset 0 -1px #d6a72d;
      color: inherit;
    }
    .filter-tag {
      --tag-color: #496b9e;
      min-height: 27px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border: 1px solid color-mix(in srgb, var(--tag-color) 38%, white);
      background: color-mix(in srgb, var(--tag-color) 7%, white);
      color: var(--tag-color);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
    }
    .filter-tag::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--tag-color);
      content: "";
    }
    .filter-tag:hover {
      border-color: var(--tag-color);
      background: color-mix(in srgb, var(--tag-color) 14%, white);
    }
    .filter-tag.selected {
      background: var(--tag-color);
      color: white;
    }
    .filter-tag.selected::before { background: white; }
    .filter-tag[data-filter-field="schools"] { --tag-color: #367667; }
    .filter-tag[data-filter-field="periods"] { --tag-color: #876a28; }
    .filter-tag[data-filter-field="topics"] { --tag-color: #a2463d; }
    .filter-tag[data-filter-field="works"] { --tag-color: #74558e; }
    .record-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .detail-panel { min-width: 0; }
    .detail {
      height: 499px;
      padding: 24px 26px;
      overflow: auto;
    }
    .detail h2 {
      margin: 0 0 4px;
      color: var(--ink);
      font: 700 21px/1.4 SimSun, "STSong", serif;
    }
    .detail .subline { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
    .study-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 21px;
      padding: 0;
    }
    .study-action {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font-size: 11px;
      font-weight: 400;
    }
    .study-action:hover:not(:disabled) { border-color: var(--ink); background: var(--pale); }
    .study-action[data-state="saved"] { border-color: var(--ink); background: var(--pale); }
    .study-action-primary { border-color: var(--ink); background: var(--ink); color: white; }
    .study-action-primary:hover:not(:disabled) { background: var(--ink-dark); color: white; }
    .study-action:disabled { cursor: wait; opacity: .58; }
    .study-action-icon { display: inline-block; width: 14px; margin-right: 3px; text-align: center; }
    .question-note-editor {
      margin: -13px 0 21px;
      padding: 14px;
      border: 1px solid var(--ink);
      background: #fbfaf7;
    }
    .note-editor-head, .note-editor-foot, .note-conflict-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .note-editor-head { margin-bottom: 9px; }
    .note-editor-title { font: 700 13px/1.4 SimSun, "STSong", serif; }
    .note-editor-status { margin-left: auto; color: var(--muted); font-size: 10px; }
    .note-editor-status.error { color: var(--accent); }
    .note-editor-close { border: 0; padding: 2px 0 2px 8px; background: transparent; color: var(--muted); font-size: 10px; }
    .note-editor-content {
      display: block;
      width: 100%;
      min-height: 132px;
      resize: vertical;
      padding: 10px 11px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font: 13px/1.7 inherit;
    }
    .note-editor-content:focus { outline: 1px solid var(--ink); border-color: var(--ink); }
    .note-editor-foot { margin-top: 9px; }
    .note-editor-hint { color: var(--muted); font-size: 9px; }
    .note-editor-count { color: var(--muted); font: 9px ui-monospace, Consolas, monospace; }
    .note-editor-button { min-height: 30px; padding: 0 10px; border: 1px solid var(--line); background: white; font-size: 10px; font-weight: 400; }
    .note-editor-sync { margin-left: auto; border-color: var(--ink); background: var(--ink); color: white; }
    .note-editor-delete { color: var(--accent); }
    .note-editor-conflict { margin: 9px 0 0; padding: 9px; background: #f3eee5; color: var(--ink); font-size: 10px; }
    .note-conflict-actions { margin-top: 7px; }
    .detail-match { margin: -14px 0 22px; }
    .detail section { margin: 0 0 21px; }
    .detail h3 {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .08em;
    }
    .detail p { margin: 0; font-size: 14px; line-height: 1.85; white-space: pre-wrap; }
    .empty { color: var(--muted); padding: 42px 24px; line-height: 1.8; }
    .missing-question-action {
      min-height: 34px;
      margin-top: 14px;
      padding: 0 14px;
      background: var(--ink);
      font-size: 11px;
    }
    footer {
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 1px 0;
      color: var(--muted);
      font-size: 9px;
    }
    @media (max-width: 850px) {
      main { width: min(100% - 28px, 680px); }
      .controls { grid-template-columns: minmax(0, 1fr) 84px; }
      .search-box { grid-column: auto; }
      #search { min-height: 34px; }
      .workspace { grid-template-columns: 1fr; }
      .results-panel { border-right: 0; border-bottom: 1px solid var(--line); }
      .results { height: 380px; }
      .detail { height: auto; min-height: 360px; }
      .filter-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .filter-strip-title { display: none; }
    }
    @media (max-width: 1200px) {
      .search-layout { grid-template-columns: 1fr; }
      .tag-panel { height: auto; max-height: 410px; }
      .tag-tabs { grid-template-columns: repeat(6, 1fr); }
      .tag-tab { border-bottom: 0; }
      .tag-tab:nth-child(3n) { border-right: 1px solid var(--line); }
      .tag-tab:last-child { border-right: 0; }
      .tag-list { min-height: 150px; }
    }
    @media (max-width: 560px) {
      .tag-tabs { grid-template-columns: repeat(3, 1fr); }
      .tag-tab { border-bottom: 1px solid var(--line); }
      .tag-tab:nth-child(3n) { border-right: 0; }
      .result-summary {
        grid-template-columns: 52px 1fr;
        gap: 6px 10px;
      }
      .result-summary .result-copy { grid-column: 1 / -1; }
      .result-tags { padding-left: 16px; }
      .filter-strip { grid-template-columns: 1fr; }
      .study-actions { flex-wrap: wrap; }
      .study-action { flex: 1 1 calc(50% - 4px); padding-inline: 8px; }
      .question-note-editor { padding: 12px; }
      .note-editor-foot { flex-wrap: wrap; }
      .note-editor-hint { width: 100%; }
      .note-editor-sync { margin-left: auto; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .workspace { animation: arrive .28s ease-out both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
    }
  </style>

</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1>中大哲学 · 历年真题</h1>
    </div>
    <nav class="primary-nav" aria-label="主要页面">
      <a class="active" href="search.html" aria-current="page"><span>真题检索</span></a>
      <a href="statistics.html"><span>考点统计</span></a>
      <a href="user.html"><span>个人档案</span></a>
    </nav>
  </header>

  <main>
    <div class="controls">
      <div class="search-box">
        <label for="keyword">检索</label>
        <input id="keyword" autocomplete="off" placeholder="例如：康德 先验、康德 OR 黑格尔、-费希特">
      </div>
      <button id="search" type="button">Search</button>
    </div>
    <div class="filter-strip" aria-label="结构化筛选和排序">
      <div class="filter-strip-title">检索条件</div>
      <label class="filter-control">
        <span>题型</span>
        <select id="sectionFilter">
          <option value="">全部题型</option>
          <option value="full_paper">全卷概览</option>
        </select>
      </label>
      <label class="filter-control">
        <span>科目</span>
        <select id="subject" aria-label="按科目筛选">
          <option value="">全部科目</option>
        </select>
      </label>
      <label class="filter-control">
        <span>结果排序</span>
        <select id="sortMode">
          <option value="relevance">相关度</option>
          <option value="year_desc">年份从新到旧</option>
          <option value="year_asc">年份从旧到新</option>
        </select>
      </label>
      <button class="reset-structured" id="resetStructured" type="button">重置</button>
    </div>

    <div class="search-layout">
      <aside class="tag-panel" aria-label="年份与分类标签筛选">
        <div class="tag-panel-head">
          <div class="tag-panel-title">索引筛选 <span id="selectedTagCount">未选择</span></div>
          <button class="clear-tags" id="clearTags" type="button" disabled>清空</button>
        </div>
        <div class="tag-scroll-region">
          <div class="tag-tabs" id="tagTabs"></div>
          <div class="tag-tools">
            <div class="tag-search">
              <label for="tagSearch" id="tagSearchLabel">年份</label>
              <input id="tagSearch" autocomplete="off" placeholder="筛选当前分类">
            </div>
          </div>
          <div class="tag-list" id="tagList"></div>
        </div>
      </aside>

      <div class="workspace" data-mobile-pane="results">
        <nav class="mobile-pane-switch" aria-label="移动端内容切换">
          <button type="button" data-pane-button="results" aria-pressed="true">
            检索结果
          </button>
          <button type="button" data-pane-button="detail" aria-pressed="false">
            题目详情
          </button>
        </nav>
        <section class="results-panel">
          <div class="panel-head">检索结果 <span id="resultCount"></span></div>
          <div class="results" id="results"></div>
        </section>
        <div class="pane-resizer" id="paneResizer" role="separator"
          aria-label="调整检索结果和试题详情的宽度"
          aria-orientation="vertical" aria-valuemin="32" aria-valuemax="68"
          aria-valuenow="52" tabindex="0"></div>
        <aside class="detail-panel">
          <div class="panel-head">
            <span class="panel-head-label">试题详情</span>
            <span class="detail-context" id="detailContext"></span>
          </div>
          <div class="detail" id="detail">
            <div class="detail-pending">I D L E&nbsp;&nbsp;&nbsp;&nbsp;S T A T E</div>
          </div>
        </aside>
      </div>
    </div>
    <footer>
      <span>项目来源</span>
      <a href="https://github.com/lemizou/SYSU_Philosophy_Entrance_Exam"
        target="_blank" rel="noopener noreferrer">
        GitHub · lemizou/SYSU_Philosophy_Entrance_Exam
      </a>
    </footer>
  </main>

  <dialog class="auth-dialog" id="authDialog" aria-labelledby="authTitle">
    <button class="dialog-close" id="closeAuthDialog" type="button" aria-label="关闭登录窗口">×</button>
    <div class="auth-card" id="authCard">
      <div>
        <p class="eyebrow">PRIVATE ARCHIVE</p>
        <h2 id="authTitle">邮箱登录</h2>
        <p id="authMessage">登录后，收藏和笔记会安全保存到你的私人档案。</p>
      </div>
      <form id="emailLoginForm">
        <label for="loginEmail">1. 填写邮箱并获取验证码</label>
        <div class="auth-row"><input id="loginEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><button type="submit">发送验证码</button></div>
      </form>
      <form id="otpForm">
        <label for="loginOtp">2. 填写邮件中的验证码</label>
        <div class="auth-row"><input id="loginOtp" name="otp" inputmode="numeric" autocomplete="one-time-code" required placeholder="请先发送验证码" disabled><button type="submit" disabled>登录</button></div>
      </form>
      <div class="session-row" id="sessionRow" hidden><span id="sessionEmail"></span><button id="signOut" type="button">退出登录</button></div>
    </div>
  </dialog>

  <script src="search_query.js"></script>
  <script src="tag_filters.js"></script>
  <script src="vendor/minisearch-7.2.0.js"></script>
  <script src="concept_aliases.js"></script>
  <script src="search_index.js"></script>
  <script src="search_engine.js"></script>
  <script src="search_highlight.js"></script>
  <script src="result_sort.js"></script>
  <script src="full_paper.js"></script>
  <script src="url_state.js"></script>
  <script src="supabase-config.js?v=2"></script>
  <script src="user_backend.js?v=2"></script>
  <script src="auth_controller.js?v=1"></script>
  <script src="page_memory.js?v=2"></script>
  <script src="question_actions.js?v=2"></script>
  <script src="note_editor.js?v=1"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let questions = [];
    let aliasMap = new Map();
    let conceptAliases = ConceptAliases.create([]);
    let searchIndex = null;
    let tagCatalog = [];
    let tagCounts = new Map();
    let filtered = [];
    let availableYears = [];
    let selectedYears = [];
    let activeIndex = -1;
    let activeQuestionId = "";
    let activeQuestionMode = "";
    let restoredQuestionId = "";
    let restoredQuestionMode = "";
    let activeTagField = "years";
    let activeKeywordQuery = { positiveGroups: [], excludedTerms: [] };
    let activeFuzzyIds = new Set();
    let urlStateReady = false;
    let questionBackend = null;
    let questionAuthController = null;
    let questionAuthUi = null;
    let questionActions = null;
    let questionNoteEditor = null;
    const SEARCH_PANE_STORAGE_KEY = "sysu-search-mobile-pane-v1";
    const SEARCH_TAG_FIELD_STORAGE_KEY = "sysu-search-tag-field-v1";
    const SEARCH_SPLIT_STORAGE_KEY = "sysu-search-pane-split-v1";

    async function openQuestionNote(action) {
      if (activeQuestionId !== action.questionId) {
        location.assign(action.returnUrl);
        return;
      }
      activeQuestionMode = "note";
      syncUrlState("push");
      questionNoteEditor?.open(action.questionId);
    }

    async function resumeQuestionAction() {
      const completed = await questionAuthController.runPendingAction({
        favorite: (action) => questionBackend.addFavorite(action.questionId),
        "open-note": openQuestionNote
      });
      if (completed?.type === "favorite" && activeQuestionId === completed.questionId) {
        await questionActions?.activate(completed.questionId);
      }
      return completed;
    }

    async function resumePendingNote() {
      return questionAuthController?.runPendingAction({
        "save-note": (action) => questionNoteEditor.resumeAfterLogin(action)
      });
    }

    async function initializeQuestionAuth() {
      try {
        questionBackend = UserBackend.createUserBackend(window.__SUPABASE_CONFIG__);
        questionAuthController = AuthController.createAuthController({ backend: questionBackend });
        questionAuthUi = AuthController.bindAuthDialog({
          controller: questionAuthController,
          async onSignedIn(user) {
            if (window.__questionAuth) window.__questionAuth.user = user;
            await questionBackend.recordActivity();
            await resumeQuestionAction();
          },
          onSignedOut: () => location.reload()
        });
        questionNoteEditor = NoteEditor.createNoteEditor({
          backend: questionBackend,
          authController: questionAuthController,
          authUi: questionAuthUi,
          onClose() {
            activeQuestionMode = "";
            syncUrlState("replace");
          }
        });
        questionActions = QuestionActions.createQuestionActions({
          backend: questionBackend,
          authController: questionAuthController,
          authUi: questionAuthUi,
          onOpenNote: openQuestionNote
        });
        const user = await questionAuthUi.initialize();
        window.__questionAuth = {
          backend: questionBackend,
          controller: questionAuthController,
          ui: questionAuthUi,
          user
        };
      } catch (error) {
        $("authMessage").textContent = error.message || "后端初始化失败";
        $("authMessage").classList.add("error-message");
      }
    }

    initializeQuestionAuth();

    const normalize = SearchEngine.normalize;
    const escapeHtml = (value) =>
      String(value ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[c]);
    const tagFields = SearchEngine.TAG_FIELDS;
    const indexFields = ["years", ...tagFields];
    const selectedTags = Object.fromEntries(tagFields.map((field) => [field, []]));
    const tagFieldConfig = {
      years: { label: "年份" },
      philosophers: { label: "人物", type: "philosopher" },
      schools: { label: "流派", type: "school" },
      periods: { label: "时期", type: "period" },
      topics: { label: "主题", type: "topic" },
      works: { label: "著作", type: "work" }
    };
    const fieldByTagType = Object.fromEntries(
      Object.entries(tagFieldConfig)
        .filter(([, config]) => config.type)
        .map(([field, config]) => [config.type, field])
    );
    const selectedValuesFor = (field) =>
      field === "years" ? selectedYears : selectedTags[field];
    const tagsFor = (question) =>
      tagFields.flatMap((field) => question[field] || []);
    const canonicalize = (value) => {
      const normalized = normalize(value);
      return normalize(aliasMap.get(normalized) || value);
    };

    function buildSearchConditions() {
      const subject = $("subject").value;
      return {
        keyword: $("keyword").value,
        tags: Object.fromEntries(
          tagFields.map((field) => [field, [...selectedTags[field]]])
        ),
        years: selectedYears.map(Number),
        subjects: subject ? [subject] : [],
        sections: $("sectionFilter").value
          && $("sectionFilter").value !== FullPaper.SECTION_VALUE
          ? [$("sectionFilter").value]
          : [],
        fullPaper: $("sectionFilter").value === FullPaper.SECTION_VALUE,
        sortMode: $("sortMode").value
      };
    }

    function captureUrlState() {
      return {
        keyword: $("keyword").value,
        question: activeQuestionId,
        mode: activeQuestionId ? activeQuestionMode : "",
        subject: $("subject").value,
        years: [...selectedYears],
        yearFrom: "",
        yearTo: "",
        section: $("sectionFilter").value,
        sortMode: $("sortMode").value,
        tags: Object.fromEntries(
          tagFields.map((field) => [field, [...selectedTags[field]]])
        )
      };
    }

    function selectHasValue(id, value) {
      return [...$(id).options].some((option) => option.value === value);
    }

    function canonicalTagForField(field, value) {
      const canonical = aliasMap.get(normalize(value)) || value;
      return tagCatalog.find((tag) =>
        tag.field === field && normalize(tag.name) === normalize(canonical))?.name;
    }

    function restoreUrlState(state) {
      restoredQuestionId = state.question || "";
      restoredQuestionMode = restoredQuestionId && state.mode === "note" ? "note" : "";
      $("keyword").value = state.keyword;
      $("subject").value = selectHasValue("subject", state.subject)
        ? state.subject
        : "";
      $("sectionFilter").value = selectHasValue("sectionFilter", state.section)
        ? state.section
        : "";
      $("sortMode").value = ResultSort.MODES.includes(state.sortMode)
        ? state.sortMode
        : "relevance";

      let restoredYears = (state.years || [])
        .map(String)
        .filter((year) => availableYears.includes(Number(year)));
      if (!restoredYears.length && (state.yearFrom || state.yearTo)) {
        const yearFrom = Number(state.yearFrom) || -Infinity;
        const yearTo = Number(state.yearTo) || Infinity;
        const lower = Math.min(yearFrom, yearTo);
        const upper = Math.max(yearFrom, yearTo);
        restoredYears = availableYears
          .filter((year) => year >= lower && year <= upper)
          .map(String);
      }
      selectedYears.splice(
        0,
        selectedYears.length,
        ...new Set(restoredYears)
      );

      for (const field of tagFields) {
        const restoredTags = (state.tags[field] || [])
          .map((value) => canonicalTagForField(field, value))
          .filter(Boolean);
        selectedTags[field].splice(
          0,
          selectedTags[field].length,
          ...new Set(restoredTags)
        );
      }
      const selectedField = indexFields.find((field) => selectedValuesFor(field).length);
      let rememberedField = "";
      try { rememberedField = localStorage.getItem(SEARCH_TAG_FIELD_STORAGE_KEY) || ""; } catch (_) {}
      activeTagField = selectedField
        || (indexFields.includes(rememberedField) ? rememberedField : "years");
      $("tagSearch").value = "";
    }

    function syncUrlState(historyMode) {
      if (!urlStateReady || historyMode === "none") return;
      const query = UrlState.serialize(captureUrlState());
      const nextSearch = query ? `?${query}` : "";
      if (nextSearch === window.location.search) return;
      const nextUrl = `${window.location.pathname}${nextSearch}${window.location.hash}`;
      if (historyMode === "replace") {
        window.history.replaceState(null, "", nextUrl);
      } else {
        window.history.pushState(null, "", nextUrl);
      }
    }

    function matchesSearchConditions(question, conditions) {
      return SearchEngine.matches(
        question,
        conditions,
        canonicalize,
        conceptAliases.expand
      );
    }

    function populateFilters() {
      availableYears = [...new Set(questions.map((q) => q.year))]
        .sort((a, b) => a - b);
      const subjects = [...new Set(questions.map((q) => q.subject))].sort();
      $("subject").insertAdjacentHTML("beforeend",
        subjects.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join(""));
      const sectionCounts = new Map();
      questions.forEach((question) => {
        const section = question.section || "未标注";
        sectionCounts.set(section, (sectionCounts.get(section) || 0) + 1);
      });
      const sectionOrder = new Map(
        ["第一类", "第二类", "第三类"].map((name, index) => [name, index])
      );
      const sections = [...sectionCounts]
        .sort((left, right) =>
          (sectionOrder.get(left[0]) ?? 99)
          - (sectionOrder.get(right[0]) ?? 99)
          || left[0].localeCompare(right[0], "zh-CN"));
      $("sectionFilter").insertAdjacentHTML(
        "beforeend",
        sections.map(([name, count]) =>
          `<option value="${escapeHtml(name)}">${escapeHtml(name)}（${count}）</option>`
        ).join("")
      );
    }

    function prepareTagCatalog(taxonomy) {
      const yearCatalog = [...new Set(questions.map((question) => question.year))]
        .map((year) => ({ name: String(year), field: "years" }));
      tagCatalog = yearCatalog.concat((taxonomy.tags || [])
        .map((tag) => ({
          name: tag.name,
          field: fieldByTagType[tag.type]
        }))
        .filter((tag) => tag.name && tag.field));
      tagCounts = TagFilters.countByField(questions, tagFields);
      questions.forEach((question) => {
        const key = `years\u0000${question.year}`;
        tagCounts.set(key, (tagCounts.get(key) || 0) + 1);
      });
    }

    function renderTagPanel() {
      const totalSelected = indexFields.reduce(
        (total, field) => total + selectedValuesFor(field).length, 0);
      $("selectedTagCount").textContent =
        totalSelected ? `已选 ${totalSelected} 项` : "未选择";
      $("clearTags").disabled = totalSelected === 0;

      $("tagTabs").innerHTML = indexFields.map((field) => {
        const config = tagFieldConfig[field];
        const selectedCount = selectedValuesFor(field).length;
        const catalogCount = tagCatalog.filter((tag) => tag.field === field).length;
        const count = selectedCount ? `${selectedCount}/${catalogCount}` : catalogCount;
        return `
          <button class="tag-tab ${field === activeTagField ? "active" : ""}"
            type="button" data-field="${field}"
            aria-pressed="${field === activeTagField}">
            ${config.label}<strong>${count}</strong>
          </button>`;
      }).join("");

      $("tagSearchLabel").textContent = tagFieldConfig[activeTagField].label;
      const needle = normalize($("tagSearch").value);
      const selected = new Set(selectedValuesFor(activeTagField));
      const visibleTags = tagCatalog
        .filter((tag) =>
          tag.field === activeTagField
          && (
            selected.has(tag.name)
            || !needle
            || normalize(tag.name).includes(needle)
          ))
        .sort((left, right) => {
          const selectedOrder =
            Number(selected.has(right.name)) - Number(selected.has(left.name));
          if (selectedOrder) return selectedOrder;
          if (activeTagField === "years") {
            return Number(right.name) - Number(left.name);
          }
          const countOrder =
            (tagCounts.get(`${activeTagField}\u0000${right.name}`) || 0)
            - (tagCounts.get(`${activeTagField}\u0000${left.name}`) || 0);
          return countOrder || left.name.localeCompare(right.name, "zh-CN");
        });

      if (!visibleTags.length) {
        const message = tagCatalog.some((tag) => tag.field === activeTagField)
          ? "没有匹配的标签，请减少输入内容。"
          : "当前题库尚无这一类标签。";
        $("tagList").innerHTML = `<div class="tag-empty">${message}</div>`;
        return;
      }

      $("tagList").innerHTML = visibleTags.map((tag) => {
        const isSelected = selected.has(tag.name);
        const count = tagCounts.get(`${activeTagField}\u0000${tag.name}`) || 0;
        return `
          <button class="tag-option ${isSelected ? "selected" : ""}"
            type="button" data-field="${activeTagField}"
            data-tag="${escapeHtml(tag.name)}" aria-pressed="${isSelected}">
            <span class="tag-mark" aria-hidden="true">${isSelected ? "✓" : ""}</span>
            <span>${escapeHtml(tag.name)}</span>
            <span class="tag-count">${count}</span>
          </button>`;
      }).join("");
    }

    function applySearch(options) {
      const historyMode = options?.historyMode || "push";
      const requestedQuestionId = options?.restoreQuestion ? restoredQuestionId : "";
      const requestedQuestionMode = requestedQuestionId ? restoredQuestionMode : "";
      restoredQuestionId = "";
      restoredQuestionMode = "";
      activeQuestionId = "";
      activeQuestionMode = "";
      activeFuzzyIds = new Set();
      let conditions;
      try {
        conditions = buildSearchConditions();
        conditions.keywordQuery = SearchQuery.parse(conditions.keyword);
        activeKeywordQuery = conditions.keywordQuery;
      } catch (error) {
        activeKeywordQuery = { positiveGroups: [], excludedTerms: [] };
        filtered = [];
        activeIndex = -1;
        $("resultCount").textContent = "语法错误";
        $("results").innerHTML =
          `<div class="empty">检索语法错误：${escapeHtml(error.message)}</div>`;
        $("detail").innerHTML =
          '<div class="empty">请检查 OR、引号或排除词的写法。</div>';
        renderTagPanel();
        syncUrlState(historyMode);
        return;
      }
      const requestedQuestion = requestedQuestionId
        ? questions.find((question) => question.id === requestedQuestionId)
        : null;
      if (requestedQuestionId && !requestedQuestion) {
        filtered = [];
        activeIndex = -1;
        renderMissingQuestion(requestedQuestionId);
        renderTagPanel();
        setMobilePane("detail");
        syncUrlState(historyMode);
        return;
      }
      const hasSearchConditions = Boolean(
        conditions.keyword.trim()
        || conditions.years.length
        || conditions.subjects.length
        || conditions.sections.length
        || conditions.fullPaper
        || tagFields.some((field) => conditions.tags[field].length)
      );
      if (!hasSearchConditions) {
        if (requestedQuestion) {
          filtered = [requestedQuestion];
          activeIndex = 0;
          activeQuestionId = requestedQuestion.id;
          activeQuestionMode = requestedQuestionMode;
          renderResults();
          renderActiveDetail();
          renderTagPanel();
          setMobilePane("detail");
          syncUrlState(historyMode);
          return;
        }
        filtered = [];
        activeIndex = -1;
        renderIdleState();
        renderTagPanel();
        setMobilePane("results");
        syncUrlState(historyMode);
        return;
      }
      const exactMatches = questions.filter((question) =>
        matchesSearchConditions(question, conditions));
      const exactIds = new Set(exactMatches.map((question) => question.id));
      const supportsFuzzyFallback =
        activeKeywordQuery.positiveGroups.length === 1
        && activeKeywordQuery.positiveGroups[0].length === 1
        && activeKeywordQuery.excludedTerms.length === 0;
      const fuzzyScores = supportsFuzzyFallback && searchIndex
        ? searchIndex.search(activeKeywordQuery.positiveGroups[0][0])
        : new Map();
      const structuralConditions = {
        ...conditions,
        keyword: "",
        keywordQuery: { positiveGroups: [], excludedTerms: [] }
      };
      const fuzzyMatches = questions.filter((question) =>
        !exactIds.has(question.id)
        && fuzzyScores.has(question.id)
        && matchesSearchConditions(question, structuralConditions));
      activeFuzzyIds = new Set(fuzzyMatches.map((question) => question.id));
      let sortedMatches;
      if (conditions.sortMode === "relevance") {
        const exactSorted = ResultSort.sort(
          exactMatches,
          conditions.sortMode,
          activeExpandedTerms(),
          tagFields,
          canonicalize
        );
        fuzzyMatches.sort((left, right) =>
          fuzzyScores.get(right.id) - fuzzyScores.get(left.id)
          || Number(right.year) - Number(left.year));
        sortedMatches = exactSorted.concat(fuzzyMatches);
      } else {
        sortedMatches = ResultSort.sort(
          exactMatches.concat(fuzzyMatches),
          conditions.sortMode,
          activeExpandedTerms(),
          tagFields,
          canonicalize
        );
      }
      filtered = conditions.fullPaper
        ? FullPaper.build(questions, sortedMatches)
        : sortedMatches;
      activeIndex = -1;
      renderResults();
      const requestedIndex = $("sectionFilter").value === FullPaper.SECTION_VALUE
        ? -1
        : filtered.findIndex((question) => question.id === requestedQuestionId);
      if (requestedIndex >= 0) {
        setActiveResult(requestedIndex);
        activeQuestionId = filtered[requestedIndex].id;
        activeQuestionMode = requestedQuestionMode;
        renderActiveDetail();
        setMobilePane("detail");
      } else if (!filtered.length) {
        renderEmpty();
      } else {
        renderSearchPending();
      }
      renderTagPanel();
      if (requestedIndex < 0) setMobilePane("results");
      syncUrlState(historyMode);
    }

    function activePositiveTerms() {
      return [...new Set(activeKeywordQuery.positiveGroups.flat())];
    }

    function activeExpandedTerms() {
      return [...new Set(activePositiveTerms().flatMap(conceptAliases.expand))];
    }

    function matchingFieldLabels(question, terms) {
      if (!terms.length) return [];
      const expandedTerms = activeExpandedTerms();
      const values = [question.question, question.passage, ...tagsFor(question)];
      const originalMatch = values.some((value) =>
        SearchHighlight.hasMatch(value, terms, canonicalize));
      const expandedMatch = expandedTerms.length > terms.length
        && values.some((value) =>
          SearchHighlight.hasMatch(value, expandedTerms, canonicalize));
      const fields = [];
      if (activeFuzzyIds.has(question.id)) fields.push("模糊匹配");
      if (!originalMatch && expandedMatch) fields.push("概念别名");
      if (SearchHighlight.hasMatch(question.question, expandedTerms, canonicalize)) {
        fields.push("题干");
      }
      if (SearchHighlight.hasMatch(question.passage, expandedTerms, canonicalize)) {
        fields.push("材料");
      }
      if (
        tagFields.some((field) =>
          (question[field] || []).some((name) =>
            SearchHighlight.hasMatch(name, expandedTerms, canonicalize)))
      ) {
        fields.push("标签");
      }
      return fields;
    }

    function renderMatchFields(question, className = "") {
      const labels = matchingFieldLabels(question, activePositiveTerms());
      if (!labels.length) return "";
      return `
        <div class="match-fields ${className}">
          <span class="match-fields-label">命中</span>
          ${labels.map((label) =>
            `<span class="match-field">${label}</span>`).join("")}
        </div>`;
    }

    function renderPassageSnippet(question) {
      const terms = activePositiveTerms();
      if (!terms.length) return "";
      const snippet = SearchHighlight.snippet(
        question.passage,
        activeExpandedTerms(),
        canonicalize,
        escapeHtml
      );
      return snippet
        ? `<p class="result-snippet">材料：${snippet}</p>`
        : "";
    }

    function renderResults() {
      if ($("sectionFilter").value === FullPaper.SECTION_VALUE) {
        renderPaperResults();
        return;
      }
      $("resultCount").textContent = `${filtered.length} 道`;
      if (!filtered.length) {
        $("results").innerHTML = '<div class="empty">没有找到符合条件的真题。<br>可以减少关键词或清空筛选条件。</div>';
        return;
      }
      $("results").innerHTML = filtered.map((q, index) => `
        <article class="result ${index === activeIndex ? "active" : ""}" data-index="${index}">
          <button class="result-summary" type="button" data-index="${index}"
            aria-label="查看 ${escapeHtml(q.year)} 年${escapeHtml(q.subject)}题目">
            <span class="meta">${escapeHtml(q.year)}</span>
            <span class="meta">${escapeHtml(q.subject)}</span>
            <span class="meta">${escapeHtml(q.section)}</span>
            <div class="result-copy">
              <div class="question">${SearchHighlight.highlight(
                q.question,
                activeExpandedTerms(),
                canonicalize,
                escapeHtml
              )}</div>
              ${renderMatchFields(q)}
              ${renderPassageSnippet(q)}
            </div>
          </button>
          <div class="result-tags">${renderQuestionTags(q)}</div>
        </article>`).join("");
    }

    function renderPaperResults() {
      $("resultCount").textContent = `${filtered.length} 份`;
      if (!filtered.length) {
        $("results").innerHTML =
          '<div class="empty">没有找到符合条件的完整试卷。<br>可以调整年份、科目或减少其他筛选条件。</div>';
        return;
      }
      $("results").innerHTML = filtered.map((paper, index) => {
        const sections = FullPaper.sectionGroups(paper.questions)
          .map((group) => group.section).join(" · ");
        return `
          <article class="result paper-result ${index === activeIndex ? "active" : ""}"
            data-index="${index}">
            <button class="result-summary" type="button" data-index="${index}"
              aria-label="查看 ${escapeHtml(paper.year)} 年${escapeHtml(paper.subject)}完整试卷">
              <span class="meta">${escapeHtml(paper.year)}</span>
              <span class="meta">${escapeHtml(paper.subject)}</span>
              <span class="meta">全卷概览</span>
              <div class="result-copy">
                <div class="question">${paper.questions.length} 道题</div>
                <p class="paper-sections">${escapeHtml(sections)}</p>
              </div>
            </button>
          </article>`;
      }).join("");
    }

    function setActiveResult(nextIndex) {
      const results = $("results");
      const nextResult = results.querySelector(
        `.result[data-index="${nextIndex}"]`
      );
      if (!nextResult) return false;

      const previousResult = results.querySelector(".result.active");
      if (previousResult !== nextResult) {
        previousResult?.classList.remove("active");
        nextResult.classList.add("active");
      }
      activeIndex = nextIndex;
      return true;
    }

    function section(label, value, highlight = false, className = "") {
      if (!value) return "";
      const content = highlight
        ? SearchHighlight.highlight(
          value,
          activeExpandedTerms(),
          canonicalize,
          escapeHtml
        )
        : escapeHtml(value);
      return `<section${className ? ` class="${className}"` : ""}><h3>${label}</h3><p>${content}</p></section>`;
    }

    function renderFilterTag(field, name) {
      const isSelected = selectedTags[field].includes(name);
      const typeLabel = tagFieldConfig[field].label;
      const action = isSelected ? "取消" : "筛选";
      return `
        <button class="filter-tag ${isSelected ? "selected" : ""}"
          type="button" data-filter-field="${field}"
          data-filter-tag="${escapeHtml(name)}" aria-pressed="${isSelected}"
          aria-label="${action}${typeLabel}标签：${escapeHtml(name)}"
          title="${action}${typeLabel}标签">
          ${SearchHighlight.highlight(
            name,
            activeExpandedTerms(),
            canonicalize,
            escapeHtml
          )}
        </button>`;
    }

    function renderQuestionTags(question) {
      return tagFields.flatMap((field) =>
        (question[field] || []).map((name) => renderFilterTag(field, name))
      ).join("");
    }

    function tagSection(label, field, values) {
      if (!values?.length) return "";
      return `
        <section>
          <h3>${label}</h3>
          <div class="record-tags">
            ${values.map((name) => renderFilterTag(field, name)).join("")}
          </div>
        </section>`;
    }

    function toggleRecordTag(field, name) {
      if (!tagFieldConfig[field] || !name) return;
      activeTagField = field;
      $("tagSearch").value = "";
      TagFilters.toggle(selectedTags[field], name);
      applySearch();
    }

    function renderDetail(q) {
      $("detailContext").textContent = `${q.year} · ${q.subject || "未知科目"}`;
      $("detail").innerHTML = `
        <p class="subline">${escapeHtml(q.section || "未知题型")} · 第 ${escapeHtml(q.number ?? "—")} 题</p>
        ${renderMatchFields(q, "detail-match")}
        ${section("题目", q.question, true)}
        ${section("材料", q.passage, true, "detail-material")}
        ${tagSection("涉及人物", "philosophers", q.philosophers)}
        ${tagSection("流派与思想传统", "schools", q.schools)}
        ${tagSection("历史时期", "periods", q.periods)}
        ${tagSection("问题与主题", "topics", q.topics)}
        ${tagSection("涉及著作", "works", q.works)}
        <div class="study-actions" data-question-actions data-question-id="${escapeHtml(q.id)}" aria-label="题目学习操作">
          <button class="study-action" type="button" data-favorite-action aria-pressed="false">
            <span class="study-action-icon" data-favorite-icon aria-hidden="true">☆</span><span data-favorite-label>收藏</span>
          </button>
          <button class="study-action study-action-primary" type="button" data-note-action aria-expanded="false" aria-controls="questionNoteEditor">笔记</button>
        </div>
        <section class="question-note-editor" id="questionNoteEditor" data-question-note data-question-id="${escapeHtml(q.id)}" aria-label="题目笔记" hidden>
          <div class="note-editor-head">
            <span class="note-editor-title">私人笔记</span>
            <span class="note-editor-status" data-note-status role="status" aria-live="polite"></span>
            <button class="note-editor-close" type="button" data-note-close>收起</button>
          </div>
          <textarea class="note-editor-content" data-note-content maxlength="50000" aria-describedby="questionNoteHint questionNoteCount" placeholder="写下你的理解、疑问或复习线索……"></textarea>
          <div class="note-editor-conflict" data-note-conflict hidden>
            本地草稿与云端版本不同。默认保留本地内容，不会自动覆盖。
            <div class="note-conflict-actions">
              <button class="note-editor-button" type="button" data-note-keep-local>保留本地草稿</button>
              <button class="note-editor-button" type="button" data-note-use-cloud>恢复云端版本</button>
            </div>
          </div>
          <div class="note-editor-foot">
            <span class="note-editor-hint" id="questionNoteHint">草稿先保存在本机；登录后可跨设备同步，文字自动保存。</span>
            <span class="note-editor-count" id="questionNoteCount" data-note-count>0 / 50,000</span>
            <button class="note-editor-button note-editor-delete" type="button" data-note-delete hidden>删除云端笔记</button>
            <button class="note-editor-button note-editor-sync" type="button" data-note-sync>登录并同步</button>
          </div>
        </section>`;
      $("detail").scrollTop = 0;
      questionNoteEditor?.activate(q.id, { open: activeQuestionMode === "note" });
      questionActions?.activate(q.id).then((state) => {
        questionNoteEditor?.applyCloudNote(q.id, state?.note);
        resumePendingNote().catch(() => {});
      });
    }

    function renderActiveDetail() {
      const item = filtered[activeIndex];
      if (!item) {
        renderEmpty();
        return;
      }
      if ($("sectionFilter").value === FullPaper.SECTION_VALUE) {
        questionActions?.deactivate();
        renderFullPaperDetail(item);
      } else {
        renderDetail(item);
      }
    }

    function renderFullPaperQuestion(question) {
      const plainPassage = Boolean(question.passage);
      return `
        <article class="paper-question">
          <div class="paper-question-number">第 ${escapeHtml(question.number ?? "—")} 题</div>
          ${question.question
            ? `<p class="paper-question-text">${SearchHighlight.highlight(
              question.question,
              activeExpandedTerms(),
              canonicalize,
              escapeHtml
            )}</p>`
            : ""}
          ${question.passage
            ? `<div class="paper-passage${plainPassage
              ? " paper-passage-plain"
              : ""}">
                ${plainPassage
                  ? ""
                  : '<div class="paper-passage-label">材料</div>'}
                <p>${SearchHighlight.highlight(
                  question.passage,
                  activeExpandedTerms(),
                  canonicalize,
                  escapeHtml
                )}</p>
              </div>`
            : ""}
        </article>`;
    }

    function renderFullPaperDetail(paper) {
      $("detailContext").textContent = `${paper.year} · ${paper.subject || "未知科目"}`;
      $("detail").innerHTML =
        paper.questions.map(renderFullPaperQuestion).join("");
      $("detail").scrollTop = 0;
    }

    function renderEmpty() {
      $("detailContext").textContent = "";
      questionActions?.deactivate();
      questionNoteEditor?.deactivate();
      $("detail").innerHTML =
        '<div class="empty"><strong>没有匹配结果</strong><br>换一个关键词，或按 Esc 清空全部条件。</div>';
    }

    function renderMissingQuestion(questionId) {
      questionActions?.deactivate();
      questionNoteEditor?.deactivate();
      const message = `找不到题目 ${escapeHtml(questionId)}。`;
      $("resultCount").textContent = "题目不存在";
      $("results").innerHTML = `<div class="empty">${message}</div>`;
      $("detail").innerHTML = `
        <div class="empty">
          <strong>这道题可能已被移除或链接有误</strong><br>
          <button class="missing-question-action" type="button" data-clear-question>返回检索</button>
        </div>`;
    }

    function renderSearchPending() {
      $("detailContext").textContent = "";
      questionActions?.deactivate();
      questionNoteEditor?.deactivate();
      $("detail").innerHTML = '<div class="detail-pending">I D L E&nbsp;&nbsp;&nbsp;&nbsp;S T A T E</div>';
      $("detail").scrollTop = 0;
    }

    function renderIdleState() {
      questionActions?.deactivate();
      const idleState = '<div class="detail-pending">I D L E&nbsp;&nbsp;&nbsp;&nbsp;S T A T E</div>';
      $("resultCount").textContent = "";
      $("detailContext").textContent = "";
      $("results").innerHTML = idleState;
      $("detail").innerHTML = idleState;
      $("results").scrollTop = 0;
      $("detail").scrollTop = 0;
    }

    function setMobilePane(pane, remember = true) {
      const workspace = document.querySelector(".workspace");
      const nextPane = pane === "detail" ? "detail" : "results";
      workspace.dataset.mobilePane = nextPane;
      workspace.querySelectorAll("[data-pane-button]").forEach((button) => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.paneButton === nextPane)
        );
      });
      if (remember) {
        try { localStorage.setItem(SEARCH_PANE_STORAGE_KEY, nextPane); } catch (_) {}
      }
    }

    const paneResizer = $("paneResizer");
    const workspace = document.querySelector(".workspace");
    const defaultPaneSplit = 52;
    const minPaneSplit = 32;
    const maxPaneSplit = 68;
    let paneSplit = defaultPaneSplit;

    function setPaneSplit(percent, remember = true) {
      paneSplit = Math.min(maxPaneSplit, Math.max(minPaneSplit, percent));
      workspace.style.setProperty("--results-share", `${paneSplit}%`);
      paneResizer.setAttribute("aria-valuenow", String(Math.round(paneSplit)));
      if (remember) {
        try { localStorage.setItem(SEARCH_SPLIT_STORAGE_KEY, String(paneSplit)); } catch (_) {}
      }
    }

    try {
      const rememberedSplit = Number(localStorage.getItem(SEARCH_SPLIT_STORAGE_KEY));
      if (Number.isFinite(rememberedSplit) && rememberedSplit >= minPaneSplit && rememberedSplit <= maxPaneSplit) {
        setPaneSplit(rememberedSplit, false);
      }
    } catch (_) {}

    function paneSplitFromPointer(clientX) {
      const bounds = workspace.getBoundingClientRect();
      if (!bounds.width) return paneSplit;
      return ((clientX - bounds.left) / bounds.width) * 100;
    }

    function finishPaneResize(event) {
      if (!paneResizer.hasPointerCapture(event.pointerId)) return;
      paneResizer.releasePointerCapture(event.pointerId);
      workspace.classList.remove("is-resizing");
    }

    paneResizer.addEventListener("pointerdown", (event) => {
      if (window.matchMedia("(max-width: 720px)").matches) return;
      event.preventDefault();
      paneResizer.setPointerCapture(event.pointerId);
      workspace.classList.add("is-resizing");
      setPaneSplit(paneSplitFromPointer(event.clientX));
    });

    paneResizer.addEventListener("pointermove", (event) => {
      if (!paneResizer.hasPointerCapture(event.pointerId)) return;
      setPaneSplit(paneSplitFromPointer(event.clientX));
    });

    paneResizer.addEventListener("pointerup", finishPaneResize);
    paneResizer.addEventListener("pointercancel", finishPaneResize);
    paneResizer.addEventListener("dblclick", () => setPaneSplit(defaultPaneSplit));
    paneResizer.addEventListener("keydown", (event) => {
      const adjustments = {
        ArrowLeft: -2,
        ArrowRight: 2,
        Home: minPaneSplit - paneSplit,
        End: maxPaneSplit - paneSplit,
      };
      if (!(event.key in adjustments)) return;
      event.preventDefault();
      setPaneSplit(paneSplit + adjustments[event.key]);
    });

    document.querySelector(".mobile-pane-switch").addEventListener("click", (event) => {
      const button = event.target.closest("[data-pane-button]");
      if (!button) return;
      setMobilePane(button.dataset.paneButton);
    });

    $("results").addEventListener("click", (event) => {
      const tag = event.target.closest("[data-filter-tag]");
      if (tag) {
        toggleRecordTag(tag.dataset.filterField, tag.dataset.filterTag);
        return;
      }
      const summary = event.target.closest(".result-summary");
      if (!summary) return;
      const nextIndex = Number(summary.dataset.index);
      if (!setActiveResult(nextIndex)) return;
      activeQuestionId = filtered[nextIndex]?.id || "";
      activeQuestionMode = "";
      renderActiveDetail();
      setMobilePane("detail");
      syncUrlState("push");
    });
    $("detail").addEventListener("click", (event) => {
      const clearQuestion = event.target.closest("[data-clear-question]");
      if (clearQuestion) {
        activeQuestionId = "";
        activeQuestionMode = "";
        renderIdleState();
        setMobilePane("results");
        syncUrlState("push");
        $("keyword").focus();
        return;
      }
      const page = event.target.closest("[data-paper-index]");
      if (page) {
        const nextIndex = Number(page.dataset.paperIndex);
        if (!setActiveResult(nextIndex)) return;
        renderActiveDetail();
        return;
      }
      const tag = event.target.closest("[data-filter-tag]");
      if (!tag) return;
      toggleRecordTag(tag.dataset.filterField, tag.dataset.filterTag);
    });
    $("tagTabs").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-field]");
      if (!tab || !tagFieldConfig[tab.dataset.field]) return;
      activeTagField = tab.dataset.field;
      try { localStorage.setItem(SEARCH_TAG_FIELD_STORAGE_KEY, activeTagField); } catch (_) {}
      $("tagSearch").value = "";
      renderTagPanel();
    });
    $("tagList").addEventListener("click", (event) => {
      const option = event.target.closest("[data-tag]");
      if (!option) return;
      const values = selectedValuesFor(option.dataset.field);
      TagFilters.toggle(values, option.dataset.tag);
      applySearch();
    });
    $("clearTags").addEventListener("click", () => {
      indexFields.forEach((field) => selectedValuesFor(field).splice(0));
      applySearch();
    });
    $("tagSearch").addEventListener("input", renderTagPanel);
    $("search").addEventListener("click", applySearch);
    $("subject").addEventListener("change", applySearch);
    $("sectionFilter").addEventListener("change", applySearch);
    $("sortMode").addEventListener("change", applySearch);
    $("resetStructured").addEventListener("click", () => {
      $("subject").value = "";
      $("sectionFilter").value = "";
      $("sortMode").value = "relevance";
      applySearch();
    });
    $("keyword").addEventListener("keydown", (event) => {
      if (event.key === "Enter") applySearch();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (event.target.closest?.("[data-question-note]")) return;
        $("keyword").value = "";
        $("subject").value = "";
        $("sectionFilter").value = "";
        $("sortMode").value = "relevance";
        $("tagSearch").value = "";
        indexFields.forEach((field) => selectedValuesFor(field).splice(0));
        applySearch();
        $("keyword").focus();
      }
    });
    window.addEventListener("popstate", () => {
      if (!urlStateReady) return;
      restoreUrlState(UrlState.parse(window.location.search));
      applySearch({ historyMode: "none", restoreQuestion: true });
    });

    Promise.all([
      fetch("../data/questions.json"),
      fetch("../data/tag_taxonomy.json"),
      fetch("../data/concept_aliases.json")
    ])
      .then(async ([questionsResponse, taxonomyResponse, conceptsResponse]) => {
        if (!questionsResponse.ok) throw new Error(`题库 HTTP ${questionsResponse.status}`);
        if (!taxonomyResponse.ok) throw new Error(`标签表 HTTP ${taxonomyResponse.status}`);
        if (!conceptsResponse.ok) throw new Error(`概念别名表 HTTP ${conceptsResponse.status}`);
        return Promise.all([
          questionsResponse.json(),
          taxonomyResponse.json(),
          conceptsResponse.json()
        ]);
      })
      .then(([data, taxonomy, concepts]) => {
        questions = data;
        aliasMap = new Map(
          (taxonomy.tags || []).flatMap((tag) =>
            (tag.aliases || []).map((alias) => [normalize(alias), tag.name]))
        );
        conceptAliases = ConceptAliases.create(concepts.groups || []);
        searchIndex = SearchIndex.create(questions, conceptAliases);
        window.__searchAppTestApi = {
          get loadedCount() { return questions.length; },
          get resultIds() { return filtered.map((question) => question.id); },
          get state() { return captureUrlState(); }
        };
        prepareTagCatalog(taxonomy);
        populateFilters();
        restoreUrlState(UrlState.parse(window.location.search));
        const explicitParams = new URLSearchParams(window.location.search);
        const hasExplicitDetail = explicitParams.has("question");
        const hasExplicitSearch = [...explicitParams.keys()].some((key) => key !== "question" && key !== "mode");
        let rememberedPane = "";
        try { rememberedPane = localStorage.getItem(SEARCH_PANE_STORAGE_KEY) || ""; } catch (_) {}
        urlStateReady = true;
        applySearch({ historyMode: "replace", restoreQuestion: true });
        if (!hasExplicitDetail && !hasExplicitSearch && (rememberedPane === "results" || rememberedPane === "detail")) {
          setMobilePane(rememberedPane);
        }
        $("keyword").focus();
      })
      .catch((error) => {
        $("results").innerHTML =
          `<div class="empty">无法读取真题数据：${escapeHtml(error.message)}<br>请通过 python src/search_web.py 启动。</div>`;
      });
  </script>
</body>
</html>
